# RT Finance — Painel web (SPA + nginx que faz proxy de /api → API).
#   fly deploy --config fly/web.fly.toml
app = "rt-finance-web"
primary_region = "gru"

[build]
  dockerfile = "../apps/web/Dockerfile"

[env]
  # nginx faz proxy de /api/* para a API pela rede privada da Fly
  API_UPSTREAM = "rt-finance-api.internal:8080"
  NGINX_RESOLVER = "[fdaa::3]:53"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
