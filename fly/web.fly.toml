# RT Finance — Web (nginx estático). Deploy: fly deploy -c fly/web.fly.toml
app = "rt-finance-web"
primary_region = "gru"

[build]
  dockerfile = "../apps/web/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
