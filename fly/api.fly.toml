# RT Finance — API (NestJS).  Deploy (da raiz do repo):
#   fly deploy --config fly/api.fly.toml
app = "rt-finance-api"
primary_region = "gru"

[build]
  dockerfile = "../apps/api/Dockerfile"

[deploy]
  # roda numa máquina efêmera antes de trocar o tráfego; falha o deploy se der erro
  release_command = "pnpm --filter @rt-finance/api exec prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  APP_TIMEZONE = "America/Sao_Paulo"
  APP_DEFAULT_CURRENCY = "BRL"
  LOG_LEVEL = "info"
  JOBS_ENABLED = "true"
  AUTH_COOKIE_SECURE = "true"
  # o browser só fala com o painel; o cookie de refresh é setado nesse host
  AUTH_COOKIE_DOMAIN = "rt-finance-web.fly.dev"
  WEB_ORIGIN = "https://rt-finance-web.fly.dev"
  # usado só para montar a URL do webhook — Evolution chama pela rede interna
  API_PUBLIC_URL = "http://rt-finance-api.internal:8080"
  EVOLUTION_BASE_URL = "http://rt-finance-evolution.internal:8080"
  EVOLUTION_INSTANCE = "rtfinance"
  AI_PROVIDER = "nvidia"
  NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
  NVIDIA_MODEL = "nvidia/nemotron-3-super-120b-a12b"
  AI_CONFIRM_THRESHOLD_CENTS = "500000"
  GROQ_BASE_URL = "https://api.groq.com/openai/v1"
  GROQ_STT_MODEL = "whisper-large-v3"

# Segredos — fly secrets set --app rt-finance-api \
#   DATABASE_URL=...            (o `fly postgres attach` já cria esse)
#   JWT_ACCESS_SECRET=...       (openssl rand -hex 32)
#   JWT_REFRESH_SECRET=...      (openssl rand -hex 32)
#   NVIDIA_API_KEY=nvapi-...
#   GROQ_API_KEY=gsk_...        (opcional — sem ela, áudio é recusado com aviso)
#   EVOLUTION_API_KEY=...       (mesma chave do app da Evolution)
#   WHATSAPP_WEBHOOK_TOKEN=...  (openssl rand -hex 24)
#   WHATSAPP_ALLOWLIST=         (vazio: autorização vem dos telefones dos membros)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
