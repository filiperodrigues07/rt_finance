# RT Finance — Evolution API (WhatsApp, Baileys). Imagem oficial.
#   fly deploy --config fly/evolution.fly.toml
# NÃO escalar além de 1 máquina (sessão única por número). Volume + Redis obrigatórios.
app = "rt-finance-evolution"
primary_region = "gru"

[build]
  image = "evoapicloud/evolution-api:v2.3.1"

[env]
  # sem IP público — a API fala com a Evolution só pela rede privada (.internal)
  SERVER_URL = "http://rt-finance-evolution.internal:8080"
  # sessão do Baileys: metadados no Postgres, chaves no Redis (evita corromper em restart)
  DATABASE_ENABLED = "true"
  DATABASE_PROVIDER = "postgresql"
  DATABASE_CONNECTION_CLIENT_NAME = "evolution_rtfinance"
  DATABASE_SAVE_DATA_INSTANCE = "true"
  DATABASE_SAVE_DATA_NEW_MESSAGE = "false"
  DATABASE_SAVE_MESSAGE_UPDATE = "false"
  DATABASE_SAVE_DATA_CONTACTS = "false"
  DATABASE_SAVE_DATA_CHATS = "false"
  # sessão do Baileys em arquivo no volume persistente (evolution_data). Para migrar
  # pro Redis depois: `fly redis create` (responda "no" ao ProdPack) e
  # `fly secrets set --app rt-finance-evolution CACHE_REDIS_URI=<url>` +
  # trocar aqui para CACHE_REDIS_ENABLED="true" / CACHE_LOCAL_ENABLED="false".
  CACHE_REDIS_ENABLED = "false"
  CACHE_LOCAL_ENABLED = "true"
  CONFIG_SESSION_PHONE_CLIENT = "RT Finance"
  # versão do WhatsApp Web fixada — revisar a cada poucos meses
  CONFIG_SESSION_PHONE_VERSION = "2.3000.1023204200"
  QRCODE_LIMIT = "30"
  LOG_LEVEL = "ERROR"
  DEL_INSTANCE = "false"

# Segredos — fly secrets set --app rt-finance-evolution \
#   AUTHENTICATION_API_KEY=...      (mesma EVOLUTION_API_KEY da API)
#   DATABASE_CONNECTION_URI=postgres://<user>:<pass>@rt-finance-db.internal:5432/evolution
#   CACHE_REDIS_URI=redis://default:<pass>@<upstash-host>:6379   (de `fly redis status`)
# Sem Redis (fallback): trocar no [env] CACHE_REDIS_ENABLED="false" e CACHE_LOCAL_ENABLED="true".

[mounts]
  source = "evolution_data"
  destination = "/evolution/instances"

# Sem [http_service]: a Evolution não tem porta pública. A API a alcança em
# rt-finance-evolution.internal:8080 pela rede 6PN da org. Não escalar além de 1.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
